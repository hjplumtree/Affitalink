engineStrict: true
# Vercel may start with an older pnpm; run the exact packageManager version.
pmOnFail: download
allowBuilds:
  unrs-resolver: false
overrides:
  "minimatch@10.2.5>brace-expansion": 5.0.12
  # Tailwind 3 still requests v6; v7.1.6 fixes selector parsing CPU exhaustion.
  "postcss-selector-parser@<7.1.6": 7.1.6
